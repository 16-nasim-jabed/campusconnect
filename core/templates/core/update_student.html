{% extends 'base.html' %}

{% block title %}
    Update Student | CampusConnect
{% endblock %}

{% block content %}

<h2>
    Update Student Information
</h2>

<p>
    Editing: {{student.name}}
</p>

<form method="post">
    {% csrf_token %}

    {{form.as_p}}

    <button type="submit">
        Update Student
    </button>
</form>

{% endblock %}
