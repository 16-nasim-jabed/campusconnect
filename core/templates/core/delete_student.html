{% extends "base.html" %}

{% block title %}
Delete Student | CampusConnect
{% endblock %}

{% block content %}
<h2>
    Delete Student
</h2>
<p>
    Are you sure you want to delete
    <strong>{{ student.name }}</strong>?
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit">
        Confirm Delete
    </button>
    <a href="{% url 'home' %}">
        Cancel
    </a>
</form>
{% endblock %}
